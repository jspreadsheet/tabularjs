name: Publish to GitHub Packages

# Mirrors each release to GitHub Packages as @jspreadsheet/tabularjs, so it shows under the repository's
# "Packages" section. npmjs.com keeps the unscoped `tabularjs` package; this does not publish there.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to publish (e.g. v2.1.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          scope: '@jspreadsheet'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # GitHub Packages only accepts packages scoped to the repository owner
      - name: Scope the package name
        run: npm pkg set name=@jspreadsheet/tabularjs

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
